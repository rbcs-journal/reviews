name: "Auditoria de Referências e DOIs (JOSS References)"

on:
  issue_comment:
    types: [created]

jobs:
  check_refs:
    name: Validar Bibliografia e DOIs
    if: |
      github.event.issue.state == 'open' &&
      (contains(github.event.comment.body, 'check references') ||
       contains(github.event.comment.body, 'verificar referencias') ||
       contains(github.event.comment.body, '/check-references') ||
       contains(github.event.comment.body, '/check-dois'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout Repositório Editorial RBCS
        uses: actions/checkout@v4

      - name: Extrair URL do Repositório Submetido
        id: parse_repo
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body || '';
            const commentBody = (context.payload.comment && context.payload.comment.body) ? context.payload.comment.body : '';
            
            const commentMatch = commentBody.match(/https:\/\/github\.com\/[a-zA-Z0-9_\-]+\/[a-zA-Z0-9_\-\.]+/);
            let targetUrl = commentMatch ? commentMatch[0] : '';
            
            if (!targetUrl) {
              const bodyMatch = issueBody.match(/https:\/\/github\.com\/[a-zA-Z0-9_\-]+\/[a-zA-Z0-9_\-\.]+/);
              if (bodyMatch) targetUrl = bodyMatch[0];
            }
            
            if (!targetUrl) {
              core.setFailed("Não foi possível identificar a URL do repositório no formulário ou no comentário.");
              return;
            }
            
            targetUrl = targetUrl.replace(/\.+$/, '');
            core.setOutput('repo_url', targetUrl);

      - name: Reagir ao Comentário
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Clonar Repositório do Autor
        run: |
          mkdir -p author_workspace
          cd author_workspace
          git clone "${{ steps.parse_repo.outputs.repo_url }}" .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Executar Checagem de Referências
        run: |
          chmod +x scripts/check_references.py
          python3 scripts/check_references.py author_workspace > refs_report.md
          cat refs_report.md

      - name: Publicar Parecer de Referências no Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportContent = fs.readFileSync('refs_report.md', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reportContent
            });
