name: 📝 Nova Submissão de Software (JOSS-style Pre-Review)
description: Submeta seu software de código aberto e artigo para revisão por pares na RBCS.
title: "[PRE REVIEW]: "
labels: ["pre-review"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por submeter seu software à **Revista Brasileira de Computação e Software Científico (RBCS)**!
        Esta submissão iniciará a fase de **PRE-REVIEW** (triagem de escopo, auditoria automatizada do repositório e designação de editor/revisores).

  - type: input
    id: title
    attributes:
      label: Título do Artigo / Software Title
      placeholder: "Ex: PyBioPipeline: A Python package for comparative genomics"
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: URL do Repositório no GitHub / Repository URL
      placeholder: "https://github.com/usuario/repositorio"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versão ou Branch / Version or Git Branch
      placeholder: "Ex: v1.0.0 ou main"
    validations:
      required: true

  - type: dropdown
    id: track
    attributes:
      label: Trilha Editorial Principal / Editorial Track
      options:
        - "🧬 Bioinformática & Biologia Computacional (Genômica, Transcriptômica, Ômicas)"
        - "🏥 Computação Biomédica & Informática em Saúde (Imagens Médicas, Sinais, EHR)"
        - "🤖 Inteligência Artificial & Ciência de Dados em Saúde e Ciência"
        - "💻 Computação Científica Geral, Métodos Numéricos & Algoritmos"
    validations:
      required: true

  - type: input
    id: authors
    attributes:
      label: Autores e Afiliações / Authors, Affiliations and ORCIDs
      placeholder: "Jane Doe (@janedoe, ORCID: 0000-0000-0000-0000, Institution X)"
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: Licença de Código Aberto (OSI-approved) / Open Source License
      placeholder: "Ex: MIT, Apache-2.0, GPL-3.0, BSD-3-Clause"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Resumo Curto e Declaração de Necessidade / Summary & Statement of Need
      placeholder: "PyBioPipeline é uma ferramenta desenvolvida para acelerar a identificação de variantes..."
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Declarações e Compromissos / Commitments
      options:
        - label: "Confirmo que sou um dos autores ou mantenedores principais do software."
          required: true
        - label: "O repositório é público no GitHub e possui uma licença OSI explícita no arquivo LICENSE."
          required: true
        - label: "O repositório contém os arquivos paper.md e paper.bib prontos para compilação via Inara."
          required: true
        - label: "O software possui documentação de instalação e testes que podem ser executados pelos revisores."
          required: true
        - label: "Concordo com o modelo de revisão por pares aberta e pública nos issues do GitHub sob licença CC-BY 4.0."
          required: true
